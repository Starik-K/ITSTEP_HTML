<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Заняття 7- Позиціонування</title>

<style>

.position-demo {
    background-color: cadetblue;
    border: 1px solid black;
    width: 300px;
    height: 50px;
    text-align: center;
    padding-top: 20px;
}

.static-pos {
    position: static;
}

.relative-pos {
    position: relative;
    left: 35px;
}

</style>

</head>

<body>

<div class="position-demo static-pos">
position: static;
</div>

<div class="position-demo relative-pos">
position: relative; left: 35px;
</div>

<div class="position-demo absolute-pos"> position: absolute; left:500px; top:400px;

</div>

</body>
</html>
