<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table</title>

<style>
table {
 width: 80%;
 min-width: 650px;
 max-width: 800px;
 margin: 0 auto;

 border-collapse: collapse;
 font-family: Arial, Helvetica, sans-serif;
}
caption{
text-align: right;
    font-weight: 700;
    color: aqua;
    text-transform: uppercase;
}
th{
    text-transform: uppercase;
}
td.th{
 text-align: center;
}

</style>

</head>
<body>

<table>
<caption>TITLE TABLE</caption>

<thead>
<tr>
<th class="spec">specification</th>
<th>free</th>
<th>basic</th>
<th>standart</th>
<th>premium</th>
</tr>
</thead>

<tbody>

<tr>
<td class="spec">Lorem, ipsum dolor.</td>
<td class="plus">+</td>
<td class="plus">+</td>
<td class="plus">+</td>
<td class="plus">+</td>
</tr>

<tr>
<td class="spec">Lorem, ipsum dolor.</td>
<td class="plus">+</td>
<td class="plus">+</td>
<td class="plus">+</td>
<td class="plus">+</td>
</tr>

<tr>
<td class="spec">Lorem, ipsum dolor.</td>
<td class="minus">-</td>
<td class="plus">+</td>
<td class="plus">+</td>
<td class="plus">+</td>
</tr>

<tr>
<td class="spec">Lorem, ipsum dolor.</td>
<td class="minus">-</td>
<td class="minus">-</td>
<td class="plus">+</td>
<td class="plus">+</td>
</tr>

<tr>
<td class="spec">Lorem, ipsum dolor.</td>
<td class="minus">-</td>
<td class="minus">-</td>
<td class="minus">-</td>
<td class="plus">+</td>
</tr>

</tbody>

<tfoot>
<tr>
<td class="spec">Total</td>
<td>$ 0.00</td>
<td>$ 9.99</td>
<td>$ 19.99</td>
<td>$ 29.99</td>
</tr>
</tfoot>

</table>

</body>
</html>
