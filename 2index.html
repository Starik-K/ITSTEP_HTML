<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<title>ыввыычыч</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    background: hsl(217, 54%, 11%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: hsl(216, 50%, 16%);
    border-radius: 15px;
    padding: 22px;
    width: 320px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

.image-box {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.image-box img.main-img {
    width: 100%;
    display: block;
    border-radius: 10px;
}
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 255, 247, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.3s ease;
}
.overlay img {
    width: 40px;
    height: 40px;
}

.image-box:hover .overlay {
    opacity: 1;
}
.title {
    color: white;
    margin: 20px 0 10px;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.title:hover {
    color: hsl(178, 100%, 50%);
}

.desc {
    color: hsl(215, 51%, 70%);
    font-size: 14px;
    line-height: 1.5;
}
.info {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
    font-size: 14px;
}

.price {
    color: hsl(178, 100%, 50%);
    font-weight: 600;
}

.time {
    color: hsl(215, 51%, 70%);
}
.line {
    height: 1px;
    background: hsl(215, 32%, 27%);
    margin: 15px 0;
}
.author {
    display: flex;
    align-items: center;
    gap: 10px;
}

.author img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid white;
}

.author span {
    color: hsl(215, 51%, 70%);
}

.author b {
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.author b:hover {
    color: hsl(178, 100%, 50%);
}

@media (max-width: 400px) {
    .card {
        width: 90%;
    }
}
</style>

</head>

<body>

<div class="card">
